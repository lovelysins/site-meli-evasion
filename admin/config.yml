backend:
  name: github
  repo: lovelysins/site-meli-evasion
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: simple
media_folder: "images/uploads"
public_folder: "images/uploads"

locale: "fr"

collections:
  - name: "contenu"
    label: "Contenu du site"
    files:
      - name: "hero"
        label: "Accueil (titre principal)"
        file: "content/hero.json"
        fields:
          - {label: "Titre principal", name: "title", widget: "string"}
          - {label: "Texte d'introduction", name: "lead", widget: "text"}

      - name: "histoire"
        label: "Notre histoire"
        file: "content/histoire.json"
        fields:
          - {label: "Photo de la capitaine", name: "photo", widget: "image", required: false}
          - {label: "Paragraphe 1", name: "text1", widget: "text"}
          - {label: "Paragraphe 2", name: "text2", widget: "text"}

      - name: "destinations"
        label: "Destinations & excursions"
        file: "content/destinations.json"
        fields:
          - name: "items"
            label: "Destination"
            widget: "list"
            summary: "{{title}}"
            fields:
              - label: "Identifiant unique (minuscules, sans espace, ex. nosy-x)"
                name: "id"
                widget: "string"
                hint: "Sert de lien direct vers cette carte. Ne le changez plus une fois publié."
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Nom de la destination", name: "title", widget: "string"}
              - {label: "Étiquette affichée sur la photo (ex. Pépite, Facile)", name: "tag", widget: "string", required: false}
              - label: "Catégories (pour les filtres)"
                name: "categories"
                widget: "select"
                multiple: true
                required: false
                options:
                  - {label: "Pépites", value: "pepites"}
                  - {label: "Aventures", value: "aventures"}
                  - {label: "Faciles", value: "faciles"}
                  - {label: "Snorkeling", value: "snorkeling"}
                  - {label: "Atypiques", value: "atypiques"}
              - {label: "Durée", name: "meta", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Tarif affiché", name: "price", widget: "string"}

      - name: "gallery"
        label: "Galerie photos"
        file: "content/gallery.json"
        fields:
          - name: "items"
            label: "Photos"
            widget: "list"
            field: {label: "Photo", name: "photo", widget: "image"}

      - name: "faq"
        label: "Questions fréquentes"
        file: "content/faq.json"
        fields:
          - name: "items"
            label: "Question"
            widget: "list"
            summary: "{{q}}"
            fields:
              - {label: "Question", name: "q", widget: "string"}
              - {label: "Réponse", name: "a", widget: "text"}

      - name: "misc"
        label: "Autres textes"
        file: "content/misc.json"
        fields:
          - {label: "Bandeau « Profil pêcheur »", name: "profil_pecheur_text", widget: "text"}
          - {label: "Avis clients — titre (en attendant vos vrais avis)", name: "testimonial_title", widget: "string"}
          - {label: "Avis clients — texte", name: "testimonial_note", widget: "text"}
